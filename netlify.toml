[build]
  base = "apps/dashboard"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["../../packages/schema/**", "netlify/functions/_lib/sf-package/**"]

[dev]
  command = "npm run dev"
  targetPort = 5173
  framework = "#custom"
  autoLaunch = false

# Cloudflare Access is the only login. Do not enable Netlify Identity.
# This root file is what Netlify uses when base = apps/dashboard. Host rules
# must live here (apps/dashboard/netlify.toml alone does not win for this site).

[[redirects]]
  from = "/*"
  to = "https://app.cloudiator.org/:splat"
  status = 301
  force = true
  conditions = {Host = ["cloudiator.netlify.app"]}

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "DENY"
