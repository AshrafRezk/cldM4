[project]
name = "cloudiator-worker"
version = "0.1.0"
description = "Cloudiator worker — OpenAI-compatible shim and RAM scheduler for a Mac Mini M4 24GB"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "tiktoken>=0.7",
    "pillow>=10.3",
    # Phase D uses Apple Vision for OCR. It is installed in Phase A so the
    # step 0 `import Vision` gate runs against the real venv.
    "pyobjc-framework-Vision>=10.3; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
default-groups = []
