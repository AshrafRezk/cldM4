[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Never bake DATABASE_URL into the Vite client. Functions read process.env.

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["../../packages/schema/**"]

[dev]
  command = "npm run dev"
  targetPort = 5173
  framework = "#custom"
  autoLaunch = false

# Cloudflare Access is the only login. Do not enable Netlify Identity.
# Netlify will not delete the *.netlify.app name. Force it onto the hostname
# that Access protects. These rules must stay above the SPA fallback.

[[redirects]]
  from = "https://cloudiator.netlify.app/*"
  to = "https://app.cloudiator.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://cloudiator.netlify.app/*"
  to = "https://app.cloudiator.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "DENY"
